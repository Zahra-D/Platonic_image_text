# LeJEPA from scratch: SIGReg instead of the EMA teacher, no pretrained trunk.
#
# The companion to the from-dense run. Layerwise data2vec over all 8 blocks,
# each block predicting its own target through its own MLP predictor, with:
#
#   * no EMA teacher -- the clean pass goes through the same network;
#   * no stop-gradient -- gradients flow through the target too;
#   * no parameter-free LayerNorm on the target;
#   * SIGReg on the pooled embedding distribution of every supervised block,
#     1024 slices and 17 Epps-Pulley points as in the reference implementation
#     (github.com/galilai-group/lejepa), combined convexly as the paper states:
#     (1 - lambda) * prediction + lambda * SIGReg, with lambda = 0.05.
#
# Why this pairing matters. Layerwise data2vec *from scratch* is the clearest
# failure in this study: with an EMA teacher it collapsed to a surface
# representation in both modalities (d_semantic -1.64 on text with matched
# masking, -1.72 and -1.27 with window masking; binding at chance). LeJEPA's
# claim is that the isotropic-Gaussian constraint removes the need for the
# teacher heuristics altogether. If that holds here, this run -- same objective,
# same blocks, same data, no teacher -- should not collapse.
#
# Four epochs, matching the from-scratch data2vec runs it is compared against.
