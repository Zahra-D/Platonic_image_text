# Separate stage-1 continuation from the corrected all-layer DANN checkpoint.
# No real text/image pair is used for a training loss. Real rows remain
# deranged; translation creates pseudo-pairs by full masked-modality sampling.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64

data:
  train_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825
  val_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825
  train_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825/train_pairs_diverse_human.jsonl
  val_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825/val_pairs_diverse_human.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/platonic_token_cache_correct_dataset_visible_check
  mode: unpaired
  balanced_modalities: true
  max_text_length: 192

model:
  grid_size: [16, 24]
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1

lora:
  train_mode: lora
  architecture: tri
  delete_base_weights: false
  rank: 384
  alpha: 256
  dropout: 0.0
  target_modules: [qkv, out_proj, mlp.0, mlp.3]

diffusion:
  objective: both
  eps: 1.0e-3
  weight_by_t: false
  full_mask_probability: 0.0

train:
  batch_size: 256
  gradient_accumulation_steps: 1
  epochs: 10
  # Conservative continuation rates protect the learned marginal model while
  # the pseudo-translation objectives ramp in.
  lr: 1.0e-4
  shared_lora_lr: 5.0e-5
  private_lora_lr: 1.0e-4
  embedding_lr: 1.0e-4
  weight_decay: 0.0
  max_grad_norm: 50.0
  num_workers: 8
  amp: bf16
  init_checkpoint: outputs/multimodal_unpaired_lora_adversarial_correct_dataset_visible_check_gradient_fixed/best.pt
  resume: null
  output_dir: outputs/multimodal_unpaired_lora_adversarial_backtranslation_contrastive_from_gradient_fixed_correct_dataset_visible_check
  log_every: 10
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  max_train_samples: null
  max_steps: null
  seed: 13

alignment:
  gradient_balance_enabled: true
  gradient_balance_ema_decay: 0.9
  gradient_balance_min_weight: 0.25
  gradient_balance_max_weight: 4.0
  shared_gradient_diagnostics: true
  gradient_diagnostics_samples_per_tensor: 64
  # Continue the corrected DANN objective. The checkpoint already completed
  # its original warmup, so this continuation activates it immediately.
  modality_adversarial_enabled: true
  modality_adversarial_start_epoch: 0
  modality_adversarial_weight: 0.1
  modality_adversarial_grl_lambda: 1.0
  modality_adversarial_warmup_steps: 0
  modality_discriminator_hidden: 128
  modality_discriminator_lr: 1.0e-4

backtranslation:
  enabled: true
  start_epoch: 0
  # Full pseudo-generation is expensive and initially noisy, so use a small
  # auxiliary subset periodically rather than every carrier batch.
  every_n_microsteps: 10
  batch_size: 8
  generation_steps: 12
  temperature: 0.0
  reveal_order: confidence
  min_confidence: 0.10
  cycle_weight: 0.10
  pseudo_align_weight: 0.05
  # In-batch negatives are necessary here: the cosine-only pilot began near
  # zero loss because DANN had already made most shared vectors nearly parallel.
  pseudo_align_loss: contrastive
  pseudo_align_temperature: 0.07
  warmup_steps: 1000
  # image->text borrows only the length/EOS slots of the independent text row;
  # all semantic text tokens are masked before pseudo-caption generation.

evaluation:
  paired_enabled: true
  paired_max_samples: 512
  mask_ratios: [0.5, 0.75, 1.0]
  control_ratios: [0.75, 1.0]
  selection_metric: marginal_t0.75

generate:
  num_samples: 4
  num_steps: 50
  temperature: 1.0
  reveal_order: confidence

wandb:
  enabled: true
  project: Platonic_baseline_CELVR
  entity: zahra-delbari-university-of-bern
  group: unpaired_tri_lora_correct_dann_backtranslation_contrastive_stage1
  run_name: unpaired_lora_correct_dann_stage1_backtranslation_contrastive_shared_source_only
