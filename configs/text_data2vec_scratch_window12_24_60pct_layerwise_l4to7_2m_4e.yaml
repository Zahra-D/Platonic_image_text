# Text data2vec from scratch, layerwise 4-7, hiding 60% of each caption in
# 12-24 token windows instead of 30%.
#
# Why the masking is this aggressive. The from-scratch runs at the usual mask
# fractions converge within a single epoch and then sit flat: the image model
# reached prediction cosine 0.978 after epoch 0 and 0.981 after epoch 3, the
# text model 0.868 -> 0.861 over four epochs. The objective is solved, not
# undertrained -- and the representations are still poor (image binding 53-55%
# against a 50% floor, text d_semantic -1.7 to +0.4). With only 30% of a
# 16x24 VQ grid hidden, 70% of a highly redundant image remains visible and the
# masked codes are nearly determined by their neighbours, so local interpolation
# satisfies the loss without any scene-level representation. These runs raise
# the fraction until the task cannot be solved locally.
#
# train_fixed_t is set to 0.9, not to the realized fraction: overlapping
# blocks/windows mean the target and the realized coverage differ. Measured on
# this data, 0.9 realizes about 61% of the eligible tokens, against ~30%
# for the original runs.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64
data:
  train_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_2m
  val_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_1m
  train_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_2m/train_text_only_human.jsonl
  val_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_1m/val_text_only_human.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/unused_text_only_cache
  mode: text_only
  balanced_modalities: false
  max_text_length: 192
model:
  grid_size:
  - 16
  - 24
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1
  use_modality_embeddings: false
lora:
  train_mode: dense
diffusion:
  objective: text
  eps: 0.001
  unweighting: false
  full_mask_probability: 0.0
  weight: 0.0
  train_fixed_t: 0.9
  bert_replacement: false
  mask_span_min: 12
  mask_span_max: 24
train:
  batch_size: 64
  gradient_accumulation_steps: 4
  epochs: 4
  lr: 0.0003
  weight_decay: 0.0
  max_grad_norm: 50.0
  num_workers: 8
  amp: bf16
  output_dir: outputs/text_data2vec_scratch_window12_24_60pct_layerwise_l4to7_2m_4e
  log_every: 10
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  seed: 20260921
alignment:
  gradient_balance_enabled: false
  shared_gradient_diagnostics: false
  objective_gradient_diagnostics_every: 0
  modality_adversarial_enabled: false
  sigreg_enabled: false
  shared_jepa_enabled: true
  shared_jepa_start_epoch: 0
  shared_jepa_warmup_steps: 1000
  shared_jepa_predictor_hidden_multiplier: 2
  shared_jepa_predictor_lr: 0.0003
  shared_jepa_ema_enabled: true
  shared_jepa_ema_decay: 0.999
  shared_jepa_ema_decay_final: 0.9999
  shared_jepa_ema_ramp_steps: 5000
  modulewise_jepa_mode: none
  modulewise_hsic_enabled: false
  data2vec_hidden: true
  data2vec_top_k: 4
  data2vec_beta: 2.0
  data2vec_weight: 1.0
  data2vec_mode: layerwise
  data2vec_layers:
  - 4
  - 5
  - 6
  - 7
evaluation:
  paired_enabled: false
  selection_metric: marginal_t0.75
generate:
  num_samples: 0
  num_steps: 50
  temperature: 1.0
  reveal_order: confidence
wandb:
  enabled: true
  project: Platonic_CLEVR_data2vec_faithful
  entity: zahra-delbari-university-of-bern
  group: hard_masking_scratch
  run_name: text_data2vec_scratch_window12_24_60pct_layerwise_l4to7_2m_4e
  tags:
  - text-only
  - dense
  - data2vec-faithful
  - hidden-state-target
  - data2vec-layerwise
  - blocks-4-7
  - no-diffusion-loss
  - ema-ramp
  - from-scratch
  - window-12-24
  - mask-30pct
  - 2m-captions
  - four-epochs
