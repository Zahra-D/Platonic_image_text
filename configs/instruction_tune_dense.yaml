# Paired bidirectional instruction tuning initialized from dense unpaired pretraining.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64

data:
  train_dir: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu_visible_s20260825
  val_dir: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu_visible_s20260825
  train_manifest: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu_visible_s20260825/train_pairs_diverse_human.jsonl
  val_manifest: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu_visible_s20260825/val_pairs_diverse_human.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/platonic_token_cache_correct_dataset_visible_check
  mode: paired
  balanced_modalities: true
  max_text_length: 192

model:
  grid_size: [16, 24]
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1

lora:
  train_mode: dense
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [qkv, out_proj, mlp.0, mlp.3]

diffusion:
  objective: both
  eps: 1.0e-3
  weight_by_t: false
  full_mask_probability: 0.15

train:
  # OOM-safe micro-batch; accumulation preserves effective batch 256.
  batch_size: 64
  epochs: 10
  lr: 1.0e-4
  weight_decay: 0.01
  num_workers: 8
  amp: bf16
  init_checkpoint: outputs/multimodal_unpaired/best.pt
  resume: null
  output_dir: outputs/multimodal_unpaired/instruction_tuning/full_pairs
  log_every: 10
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  max_train_samples: null
  max_steps: null
  seed: 13
  gradient_accumulation_steps: 4
  max_grad_norm: 1.0

evaluation:
  paired_enabled: true
  paired_max_samples: 512
  mask_ratios: [0.5, 0.75, 1.0]
  control_ratios: [0.75, 1.0]
  step_every: 50
  step_max_samples: 128
  step_mask_ratios: [1.0]
  step_control_ratios: [1.0]
  selection_metric: paired_t1_matched

generate:
  num_samples: 4
  num_steps: 50
  temperature: 1.0
  reveal_order: confidence

wandb:
  enabled: true
  project: Platonic_baseline_CELVR
  entity: zahra-delbari-university-of-bern
  group: instruction_tuning_full_pairs
  run_name: dense_instruction_full_pairs_bs64x4
