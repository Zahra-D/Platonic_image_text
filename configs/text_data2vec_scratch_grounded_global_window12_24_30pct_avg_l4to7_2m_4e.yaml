# From-scratch semantic bootstrap: one epoch of structured denoising, followed
# by joint denoising + tokenwise data2vec + a pooled clean-scene JEPA target.
#
# This directly tests the diagnosis from the completed scratch runs.  Pure
# layerwise JEPA starts from a random self-target and loses information with
# depth.  Pure averaged JEPA with large windows is healthier, but has no
# grounding/generation objective.  Here the EMA teacher follows a denoising-
# grounded student during epoch 0; JEPA starts in epoch 1 and cannot discard
# token identity because reconstruction remains active.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64
data:
  train_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_2m
  val_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_1m
  train_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_2m/train_text_only_human.jsonl
  val_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_1m/val_text_only_human.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/unused_text_only_cache
  mode: text_only
  balanced_modalities: false
  max_text_length: 192
model:
  grid_size: [16, 24]
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1
  use_modality_embeddings: false
lora:
  train_mode: dense
diffusion:
  objective: text
  eps: 0.001
  unweighting: false
  full_mask_probability: 0.0
  weight: 1.0
  train_fixed_t: 0.3
  bert_replacement: false
  mask_span_min: 12
  mask_span_max: 24
train:
  batch_size: 64
  gradient_accumulation_steps: 4
  epochs: 4
  lr: 0.0003
  weight_decay: 0.0
  max_grad_norm: 50.0
  num_workers: 8
  amp: bf16
  output_dir: outputs/text_data2vec_scratch_grounded_global_window12_24_30pct_avg_l4to7_2m_4e
  log_every: 10
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  seed: 20260922
alignment:
  gradient_balance_enabled: false
  shared_gradient_diagnostics: false
  objective_gradient_diagnostics_every: 0
  modality_adversarial_enabled: false
  sigreg_enabled: false
  shared_jepa_enabled: true
  # Epoch 0 grounds the randomly initialized trunk with denoising.  The EMA
  # teacher is updated throughout that epoch, then becomes the JEPA target.
  shared_jepa_start_epoch: 1
  shared_jepa_warmup_steps: 2000
  shared_jepa_predictor_hidden_multiplier: 2
  shared_jepa_predictor_lr: 0.0003
  shared_jepa_ema_enabled: true
  shared_jepa_ema_decay: 0.99
  shared_jepa_ema_decay_final: 0.9999
  shared_jepa_ema_ramp_steps: 12000
  modulewise_jepa_mode: none
  modulewise_hsic_enabled: false
  data2vec_hidden: true
  data2vec_top_k: 4
  data2vec_beta: 2.0
  data2vec_weight: 1.0
  data2vec_mode: average
  data2vec_layers: [4, 5, 6, 7]
  # Pool every content token, not only the masked span.  This explicitly asks
  # the corrupted student for a clean scene-level code.
  data2vec_global_weight: 1.0
  # Small anti-collapse pressure on the pre-predictor pooled trunk state.
  data2vec_variance_weight: 0.1
  data2vec_variance_target: 1.0
evaluation:
  paired_enabled: false
  selection_metric: marginal_t0.75
generate:
  num_samples: 0
  num_steps: 50
  temperature: 1.0
  reveal_order: confidence
wandb:
  enabled: true
  project: Platonic_CLEVR_data2vec_faithful
  entity: zahra-delbari-university-of-bern
  group: text_data2vec_scratch_bootstrap
  run_name: text_data2vec_scratch_grounded_global_window12_24_30pct_avg_l4to7_2m_4e
  tags:
  - text-only
  - dense
  - data2vec
  - from-scratch
  - denoising-grounded
  - global-scene-target
  - variance-floor
  - averaged-blocks-4-7
  - window-12-24
  - mask-30pct
  - 2m-captions
  - four-epochs
