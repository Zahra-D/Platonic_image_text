# From-scratch bidirectional paired CLEVR pretraining with all parameters trainable.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64

data:
  train_dir: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu_visible_s20260825
  val_dir: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu_visible_s20260825
  train_manifest: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu_visible_s20260825/train_pairs_diverse_human.jsonl
  val_manifest: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu_visible_s20260825/val_pairs_diverse_human.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/platonic_token_cache_correct_dataset_visible_check
  mode: paired                 # paired | unpaired
  max_text_length: 192

model:
  grid_size: [16, 24]
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1

lora:
  train_mode: dense            # dense | lora
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [qkv, out_proj, mlp.0, mlp.3]

diffusion:
  objective: both              # paired text->image plus image->text denoising forwards
  eps: 1.0e-3
  weight_by_t: false

train:
  batch_size: 16
  epochs: 100
  lr: 3.0e-4
  weight_decay: 0.01
  num_workers: 4
  amp: bf16
  output_dir: outputs/multimodal_dense_correct_dataset_visible_check
  log_every: 20
  eval_every: 1
  save_every: 1
  val_max_samples: 1024
  max_train_samples: null
  max_steps: null
  resume: null
  seed: 13
  # 16 paired rows expose 16 text + 16 image targets per microstep; x2 = 32+32/update.
  gradient_accumulation_steps: 2
  max_grad_norm: 1.0

generate:
  num_samples: 4
  num_steps: 50
  temperature: 1.0
  reveal_order: confidence

wandb:
  enabled: true
  project: Platonic_baseline_CELVR
  entity: zahra-delbari-university-of-bern
  group: multimodal_dense_correct_dataset_visible_check
  run_name: dense_paired_only_correct_dataset_visible_check
