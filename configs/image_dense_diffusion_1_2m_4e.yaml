# Image-only dense control: 1.2M CLEVR images, 4 epochs. Matched to the LoRA runs.
tokenizer: {checkpoint: outputs/vqvae_training_bs128/best.pt, num_codes: 512, embed_dim: 64}
data:
  train_dir: ${CLEVR_DATA}/platonic_clevr_v1_5M_train_gpu_visible
  val_dir: ${CLEVR_DATA}/platonic_clevr_v1_5M_train_gpu_visible
  train_manifest: ${CLEVR_DATA}/platonic_clevr_v1_5M_train_gpu_visible/train_image_only.jsonl
  val_manifest: ${CLEVR_DATA}/platonic_clevr_v1_5M_train_gpu_visible/val_image_only.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/image_only_1_2m_token_cache
  mode: image_only
  balanced_modalities: false
  max_text_length: 192
model: {grid_size: [16, 24], d_model: 384, n_layers: 8, n_heads: 6, mlp_ratio: 4, dropout: 0.1, use_modality_embeddings: false}
diffusion: {objective: image, eps: 1.0e-3, unweighting: false, full_mask_probability: 0.0}
lora: {train_mode: dense}
train:
  batch_size: 64
  epochs: 4
  lr: 3.0e-4
  weight_decay: 0.0
  max_grad_norm: 50.0
  gradient_accumulation_steps: 4
  num_workers: 8
  amp: bf16
  log_every: 10
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  seed: 20260921
  output_dir: outputs/image_dense_diffusion_1_2m_4e
alignment:
  gradient_balance_enabled: false
  shared_gradient_diagnostics: false
  objective_gradient_diagnostics_every: 0
  modality_adversarial_enabled: false
  sigreg_enabled: false
  shared_jepa_enabled: false
evaluation: {paired_enabled: false, selection_metric: marginal_t0.75}
generate: {num_samples: 0, num_steps: 50, temperature: 1.0, reveal_order: confidence}
wandb:
  enabled: true
  project: Platonic_CLEVR_image_modulewise_jepa_hsic
  entity: zahra-delbari-university-of-bern
  group: image_only_1_2m_4epoch
  run_name: image_dense_diffusion_1_2m_4e
  tags: [pretraining, image-only, dense, control, 1_2m-images, four-epochs]
