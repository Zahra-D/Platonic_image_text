# One-pass, no-repeat text-only reference.  CLI supplies run-specific learning
# rate, output directory, and W&B name; effective batch is deliberately 64.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64
data:
  train_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825
  val_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825
  train_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825/train_pairs_diverse_human.jsonl
  val_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825/val_pairs_diverse_human.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/platonic_token_cache_correct_dataset_visible_check
  mode: unpaired
  balanced_modalities: true
  max_text_length: 192
model:
  grid_size: [16, 24]
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1
  use_modality_embeddings: false
lora:
  train_mode: lora
  rank: 384
  alpha: 256
  dropout: 0.0
  target_modules: [qkv, out_proj, mlp.0, mlp.3]
diffusion: {objective: text, eps: 1.0e-3, unweighting: false}
train:
  batch_size: 64
  epochs: 1
  lr: 1.0e-4
  shared_lora_lr: 5.0e-5
  private_lora_lr: 1.0e-4
  embedding_lr: 1.0e-4
  shared_only_epochs: 0
  weight_decay: 0.0
  max_grad_norm: 50.0
  gradient_accumulation_steps: 1
  num_workers: 8
  amp: bf16
  output_dir: outputs/text_diffusion_onepass_bs64_reference
  log_every: 10
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  seed: 31
alignment:
  gradient_balance_enabled: false
  shared_gradient_diagnostics: true
  objective_gradient_diagnostics_every: 500
  objective_gradient_diagnostic_layers: [2, 3, 4]
  modality_adversarial_enabled: false
  sigreg_enabled: false
  shared_jepa_enabled: false
evaluation:
  paired_enabled: false
  selection_metric: marginal_t0.75
generate: {num_samples: 0, num_steps: 50, temperature: 1.0, reveal_order: confidence}
wandb:
  enabled: true
  project: Platonic_CLEVR_single_modality_ema_jepa
  entity: zahra-delbari-university-of-bern
  group: text_onepass_bs64_reference
  run_name: text_onepass_bs64_lr1e4
  tags: [pretraining, text-only, lora, tri-lora, no-base, no-modality-embedding, learned-absolute-position, diffusion-only, one-pass, no-repeat, bs64, reference]
