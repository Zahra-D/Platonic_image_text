# One-pass Tri-LoRA text diffusion on the Blender-free rule-governed corpus.
# This corpus is explicitly text-only: it never loads image tokens or creates
# pseudo-pairs.  The 3e-4 LR was the strongest of the completed bs=64
# one-pass reference sweep (1e-4, 2e-4, 3e-4).
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64
data:
  train_dir: ${CLEVR_DATA}/platonic_text_only_v1_1m
  val_dir: ${CLEVR_DATA}/platonic_text_only_v1_1m
  train_manifest: ${CLEVR_DATA}/platonic_text_only_v1_1m/train_text_only_human.jsonl
  val_manifest: ${CLEVR_DATA}/platonic_text_only_v1_1m/val_text_only_human.jsonl
  caption_field: caption_human
  # Unused in text_only mode; retained only because the shared CLI exposes it.
  token_cache_dir: outputs/unused_text_only_cache
  mode: text_only
  balanced_modalities: false
  max_text_length: 192
model:
  grid_size: [16, 24]
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1
  use_modality_embeddings: false
lora:
  train_mode: lora
  rank: 384
  alpha: 256
  dropout: 0.0
  target_modules: [qkv, out_proj, mlp.0, mlp.3]
diffusion: {objective: text, eps: 1.0e-3, unweighting: false}
train:
  batch_size: 64
  epochs: 1
  lr: 3.0e-4
  shared_lora_lr: 1.5e-4
  private_lora_lr: 3.0e-4
  embedding_lr: 3.0e-4
  shared_only_epochs: 0
  weight_decay: 0.0
  max_grad_norm: 50.0
  gradient_accumulation_steps: 1
  num_workers: 8
  amp: bf16
  output_dir: outputs/text_diffusion_text_only_1m_human_bs64_lr3e4
  log_every: 50
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  seed: 20260915
alignment:
  gradient_balance_enabled: false
  shared_gradient_diagnostics: true
  objective_gradient_diagnostics_every: 500
  objective_gradient_diagnostic_layers: [2, 3, 4]
  modality_adversarial_enabled: false
  sigreg_enabled: false
  shared_jepa_enabled: false
evaluation:
  paired_enabled: false
  selection_metric: marginal_t0.75
generate: {num_samples: 0, num_steps: 50, temperature: 1.0, reveal_order: confidence}
wandb:
  enabled: true
  project: Platonic_CLEVR_single_modality_ema_jepa
  entity: zahra-delbari-university-of-bern
  group: text_only_rule_corpus
  run_name: text_lora_text_only_1m_human_caption_onepass_bs64_lr3e4
  tags: [pretraining, text-only, lora, tri-lora, no-base, no-modality-embedding, learned-absolute-position, diffusion-only, one-pass, no-repeat, rule-governed, blender-free, human-caption-grammar, bs64, lr3e-4]
