# LeJEPA instead of data2vec: SIGReg in place of the EMA teacher.
#
# LeJEPA (arXiv 2511.08544) proves the isotropic Gaussian is the optimal
# embedding distribution for a JEPA and enforces it with SIGReg -- univariate
# goodness-of-fit tests on random 1D projections, via the Cramer-Wold principle
# -- which it argues removes the need for stop-gradients, teacher-student
# networks and EMA momentum encoders entirely.
#
# This run is the best configuration in the study (layerwise, all 8 blocks,
# from the dense trunk) with exactly those three heuristics removed:
#
#   * no EMA teacher: the clean pass goes through the *same* network;
#   * no stop-gradient: gradients flow through the target as well;
#   * no parameter-free LayerNorm on the target, which data2vec needs to stay
#     scale-free and LeJEPA replaces with the distributional constraint;
#   * SIGReg on the pooled
#     embedding distribution of every supervised block, with the reference
#     implementation's settings (1024 slices, 17 Epps-Pulley points) and the
#     paper's convex objective (1 - lambda) * prediction + lambda * SIGReg,
#     lambda = 0.05.
#
# What to watch: `target_spread` is the collapse detector. Under data2vec it
# held at 0.03-0.04. If SIGReg does its job it should hold here too, with no
# teacher anywhere in the run.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64
data:
  train_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_2m
  val_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_1m
  train_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_2m/train_text_only_human.jsonl
  val_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_text_only_v1_1m/val_text_only_human.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/unused_text_only_cache
  mode: text_only
  balanced_modalities: false
  max_text_length: 192
