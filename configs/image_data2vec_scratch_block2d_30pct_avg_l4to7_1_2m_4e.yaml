# Image data2vec from scratch with 2D BLOCK masking, averaged over blocks 4-7.
#
# The image analogue of the from-scratch text window runs. No pretrained
# initialization and no reconstruction term (diffusion.weight = 0); the target
# is the mean of the parameter-free LayerNorm-ed EMA-teacher states of
# blocks 4-7, predicted from the student's final block through one head.
#
# Masking is I-JEPA-style rather than 1D: the 384 eligible tokens are the
# 16x24 VQ grid, and each mask is a rectangle covering 10-25% of the grid with
# an aspect ratio in [0.75, 1.5]. Enough rectangles are drawn to hide ~30% of
# the grid (realized ~30%; overlapping blocks make it approximate). Scattered
# single codes would be recoverable from their neighbours, since a VQ grid is
# locally redundant -- a contiguous region is not.
#
# Data: the 1.2M-image token cache (outputs/image_only_1_2m_token_cache).
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64
data:
  train_dir: ${CLEVR_DATA}/platonic_clevr_v1_5M_train_gpu_visible
  val_dir: ${CLEVR_DATA}/platonic_clevr_v1_5M_train_gpu_visible
  train_manifest: ${CLEVR_DATA}/platonic_clevr_v1_5M_train_gpu_visible/train_image_only.jsonl
  val_manifest: ${CLEVR_DATA}/platonic_clevr_v1_5M_train_gpu_visible/val_image_only.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/image_only_1_2m_token_cache
  mode: image_only
  balanced_modalities: false
  max_text_length: 192
model:
  grid_size:
  - 16
  - 24
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1
  use_modality_embeddings: false
diffusion:
  objective: image
  eps: 0.001
  unweighting: false
  full_mask_probability: 0.0
  weight: 0.0
  train_fixed_t: 0.3
  mask_block_2d: true
  mask_block_scale:
  - 0.1
  - 0.25
  mask_block_aspect:
  - 0.75
  - 1.5
lora:
  train_mode: dense
train:
  batch_size: 64
  epochs: 4
  lr: 0.0003
  weight_decay: 0.0
  max_grad_norm: 50.0
  gradient_accumulation_steps: 4
  num_workers: 8
  amp: bf16
  log_every: 10
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  seed: 20260921
  output_dir: outputs/image_data2vec_scratch_block2d_30pct_avg_l4to7_1_2m_4e
  probe_every_steps: 0
alignment:
  gradient_balance_enabled: false
  shared_gradient_diagnostics: false
  objective_gradient_diagnostics_every: 0
  modality_adversarial_enabled: false
  sigreg_enabled: false
  shared_jepa_enabled: true
  shared_jepa_start_epoch: 0
  shared_jepa_warmup_steps: 1000
  shared_jepa_predictor_hidden_multiplier: 2
  shared_jepa_predictor_lr: 0.0003
  shared_jepa_ema_enabled: true
  shared_jepa_ema_decay: 0.999
  shared_jepa_ema_decay_final: 0.9999
  shared_jepa_ema_ramp_steps: 5000
  modulewise_jepa_mode: none
  modulewise_hsic_enabled: false
  data2vec_hidden: true
  data2vec_mode: average
  data2vec_layers:
  - 4
  - 5
  - 6
  - 7
  data2vec_top_k: 4
  data2vec_beta: 2.0
  data2vec_weight: 1.0
evaluation:
  paired_enabled: false
  selection_metric: marginal_t0.75
generate:
  num_samples: 0
  num_steps: 50
  temperature: 1.0
  reveal_order: confidence
wandb:
  enabled: true
  project: Platonic_CLEVR_data2vec_faithful
  entity: zahra-delbari-university-of-bern
  group: image_data2vec_scratch_block2d
  run_name: image_data2vec_scratch_block2d_30pct_avg_l4to7_1_2m_4e
  tags:
  - image-only
  - dense
  - data2vec-faithful
  - hidden-state-target
  - data2vec-averaged
  - blocks-4-7
  - no-diffusion-loss
  - ema-ramp
  - from-scratch
  - block-2d-masking
  - mask-30pct
  - 1_2m-images
  - four-epochs
