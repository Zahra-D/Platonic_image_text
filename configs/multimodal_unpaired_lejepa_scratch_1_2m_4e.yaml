# LeJEPA from scratch on both modalities at once.
#
# No pretrained trunk of any kind and no reconstruction loss: a randomly
# initialized dense model sees captions and images unpaired, and the only
# objective is layerwise data2vec over all 8 blocks -- each block predicting its
# own target through its own MLP predictor -- with SIGReg in place of the EMA
# teacher (no teacher, no stop-gradient, no target LayerNorm; 1024 slices, 17
# Epps-Pulley points, convex objective (1 - lambda) * prediction + lambda *
# SIGReg with lambda = 0.05).
#
# This is the hardest version of the claim in the whole study. From-scratch
# layerwise data2vec collapsed with an EMA teacher in *both* modalities
# separately (text d_semantic -1.64, image scene probe 61% against dense's 81%).
# Doing it from scratch on both modalities at once, with the teacher removed
# entirely, tests whether SIGReg alone can carry an objective that the teacher
# heuristics could not.
#
# Unpaired sampling note: each epoch draws min(n_text, n_image) items -- here
# both are 1.2M, so nothing is dropped -- with a derangement guaranteeing a
# caption is never carried with its own image, redrawn every epoch.
#
# Four epochs, matching the other from-scratch runs.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64
data:
  train_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_5M_train_gpu_visible
  val_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_5M_train_gpu_visible
