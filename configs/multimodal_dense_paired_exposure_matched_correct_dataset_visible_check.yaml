# From-scratch paired dense control matched to unpaired pretraining exposure:
# 128 paired rows/update -> 128 text and 128 image targets/update,
# 89,984 rows and exactly 703 optimizer updates per epoch for 50 epochs.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64

data:
  train_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825
  val_dir: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825
  train_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825/train_pairs_diverse_human.jsonl
  val_manifest: /home/zd25e122/clevr-dataset-gen_clone/output/platonic_clevr_v1_100k_gpu_visible_s20260825/val_pairs_diverse_human.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/platonic_token_cache_correct_dataset_visible_check
  mode: paired
  max_text_length: 192

model:
  grid_size: [16, 24]
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1

lora:
  train_mode: dense
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [qkv, out_proj, mlp.0, mlp.3]

diffusion:
  objective: both
  eps: 1.0e-3
  weight_by_t: false

train:
  # 16 rows/microbatch x 8 accumulation = 128 pairs/update.
  batch_size: 16
  gradient_accumulation_steps: 8
  epochs: 50
  lr: 3.0e-4
  weight_decay: 0.01
  num_workers: 8
  amp: bf16
  output_dir: outputs/multimodal_dense_paired_exposure_matched_correct_dataset_visible_check
  log_every: 10
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  # 89,984 / 16 / 8 = exactly 703 updates, matching unpaired pretraining.
  max_train_samples: 89984
  max_steps: null
  resume: null
  seed: 13
  max_grad_norm: 1.0

evaluation:
  paired_enabled: true
  paired_max_samples: 512
  mask_ratios: [0.5, 0.75, 1.0]
  control_ratios: [0.75, 1.0]

generate:
  num_samples: 4
  num_steps: 50
  temperature: 1.0
  reveal_order: confidence

wandb:
  enabled: true
  project: Platonic_baseline_CELVR
  entity: zahra-delbari-university-of-bern
  group: dense_paired_vs_unpaired_exposure_matched_correct_dataset_visible_check
  run_name: dense_paired_bs128_703_steps_50e_exposure_matched_correct_dataset_visible_check
