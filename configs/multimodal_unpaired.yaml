# Unpaired modality pretraining: text and image records are independent samples.
# This learns both marginal distributions but cannot learn text-to-image alignment.
tokenizer:
  checkpoint: outputs/vqvae_training_bs128/best.pt
  num_codes: 512
  embed_dim: 64

data:
  train_dir: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu
  val_dir: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu
  train_manifest: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu/train_pairs_diverse_human.jsonl
  val_manifest: ${CLEVR_DATA}/platonic_clevr_v1_100k_gpu/val_pairs_diverse_human.jsonl
  caption_field: caption_human
  token_cache_dir: outputs/platonic_token_cache
  mode: unpaired
  balanced_modalities: true
  max_text_length: 192

model:
  grid_size: [16, 24]
  d_model: 384
  n_layers: 8
  n_heads: 6
  mlp_ratio: 4
  dropout: 0.1

lora:
  train_mode: dense
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules: [qkv, out_proj, mlp.0, mlp.3]

diffusion:
  objective: both
  eps: 1.0e-3
  weight_by_t: false

train:
  # Total batch: 128 independent text + 128 independent image examples.
  batch_size: 256
  epochs: 50
  lr: 3.0e-4
  weight_decay: 0.01
  num_workers: 8
  amp: bf16
  output_dir: outputs/multimodal_unpaired
  log_every: 20
  eval_every: 1
  save_every: 1
  val_max_samples: 2048
  max_train_samples: null
  max_steps: null
  resume: null
  seed: 13
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0

evaluation:
  # Uses true validation pairs only for measurement, never for pretraining updates.
  paired_enabled: true
  paired_max_samples: 512
  mask_ratios: [0.5, 0.75, 1.0]
  # Correct-vs-wrong/no-context gaps directly test cross-modal conditioning.
  control_ratios: [0.75, 1.0]

generate:
  num_samples: 4
  num_steps: 50
  temperature: 1.0
  reveal_order: confidence

wandb:
  enabled: true
  project: Platonic_baseline_CELVR
  entity: zahra-delbari-university-of-bern
  group: multimodal_unpaired
  run_name: null
